server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Favicon - evitar error 404
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }

    location /api/ {
        proxy_pass http://openvas-api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para ThreatGuard API
    location /dashboard/ {
        proxy_pass http://threatguard-api:8000/dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Servir archivos estáticos de alertas
    location /alerts/ {
        alias /usr/share/nginx/html/alerts/;
        try_files $uri $uri/ =404;
    }

    # Servir archivos estáticos de assets
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        try_files $uri $uri/ =404;
    }

    # Servir archivos estáticos de executive summary
    location /executive_summary/ {
        alias /usr/share/nginx/html/executive_summary/;
        try_files $uri $uri/ =404;
    }

    # Servir archivos estáticos de reports
    location /reports/ {
        alias /usr/share/nginx/html/reports/;
        try_files $uri $uri/ =404;
    }

    # Servir archivos estáticos de settings
    location /settings/ {
        alias /usr/share/nginx/html/settings/;
        try_files $uri $uri/ =404;
    }

    # Servir archivos estáticos de SOAR
    location /soar/ {
        alias /usr/share/nginx/html/soar/;
        try_files $uri $uri/ =404;
    }

    # Servir archivos estáticos de vulnerability management
    location /vulnerability_management/ {
        alias /usr/share/nginx/html/vulnerability_management/;
        try_files $uri $uri/ =404;
    }

    # API de alertas
    location /api/alerts {
        proxy_pass http://threatguard-api:8000/alerts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API de SOAR
    location /api/soar {
        proxy_pass http://threatguard-api:8000/soar;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

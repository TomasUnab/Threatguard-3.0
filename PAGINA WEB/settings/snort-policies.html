<!-- Panel de Políticas -->
<div id="panel-snort-policies" class="snort-panel hidden">
    <h3 class="text-white text-xl font-bold mb-6">Gestión de Políticas por Categoría</h3>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
        <div class="bg-[#111418] rounded-xl border border-[#3b4754] p-6">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-blue-400 text-3xl">router</span>
                    <div>
                        <h4 class="text-white font-bold">Network</h4>
                        <p class="text-[#9dabb9] text-sm" id="network-count">0 reglas</p>
                    </div>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" class="sr-only peer" id="policy-network" checked>
                    <div class="w-11 h-6 bg-gray-600 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
                </label>
            </div>
        </div>
        
        <div class="bg-[#111418] rounded-xl border border-[#3b4754] p-6">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-purple-400 text-3xl">language</span>
                    <div>
                        <h4 class="text-white font-bold">Web</h4>
                        <p class="text-[#9dabb9] text-sm" id="web-count">0 reglas</p>
                    </div>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" class="sr-only peer" id="policy-web" checked>
                    <div class="w-11 h-6 bg-gray-600 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-500"></div>
                </label>
            </div>
        </div>
        
        <div class="bg-[#111418] rounded-xl border border-[#3b4754] p-6">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-red-400 text-3xl">bug_report</span>
                    <div>
                        <h4 class="text-white font-bold">Malware</h4>
                        <p class="text-[#9dabb9] text-sm" id="malware-count">0 reglas</p>
                    </div>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" class="sr-only peer" id="policy-malware" checked>
                    <div class="w-11 h-6 bg-gray-600 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-500"></div>
                </label>
            </div>
        </div>
        
        <div class="bg-[#111418] rounded-xl border border-[#3b4754] p-6">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-orange-400 text-3xl">warning</span>
                    <div>
                        <h4 class="text-white font-bold">DoS/DDoS</h4>
                        <p class="text-[#9dabb9] text-sm" id="dos-count">0 reglas</p>
                    </div>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" class="sr-only peer" id="policy-dos" checked>
                    <div class="w-11 h-6 bg-gray-600 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-orange-500"></div>
                </label>
            </div>
        </div>
        
        <div class="bg-[#111418] rounded-xl border border-[#3b4754] p-6">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-yellow-400 text-3xl">search</span>
                    <div>
                        <h4 class="text-white font-bold">Scan</h4>
                        <p class="text-[#9dabb9] text-sm" id="scan-count">0 reglas</p>
                    </div>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" class="sr-only peer" id="policy-scan" checked>
                    <div class="w-11 h-6 bg-gray-600 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-yellow-500"></div>
                </label>
            </div>
        </div>
    </div>
    
    <div class="flex gap-3">
        <button id="apply-policies-btn" class="px-6 py-3 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors font-medium">
            Aplicar Políticas
        </button>
        <button id="enable-all-policies-btn" class="px-6 py-3 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors font-medium">
            Activar Todas
        </button>
        <button id="disable-all-policies-btn" class="px-6 py-3 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors font-medium">
            Desactivar Todas
        </button>
    </div>
</div>

<!-- Modal Editar Regla -->
<div id="edit-rule-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
    <div class="bg-[#111418] rounded-xl border border-[#3b4754] p-6 w-full max-w-2xl">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-white text-xl font-bold">Editar Regla</h3>
            <button id="close-edit-modal" class="text-[#9dabb9] hover:text-white">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="space-y-4">
            <input type="hidden" id="edit-rule-index">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-white text-sm font-medium mb-2 block">SID</label>
                    <input id="edit-rule-sid" type="number" class="w-full px-4 py-2 bg-[#1c2127] text-white rounded-lg border border-[#3b4754]" readonly>
                </div>
                <div>
                    <label class="text-white text-sm font-medium mb-2 block">Categoría</label>
                    <select id="edit-rule-category" class="w-full px-4 py-2 bg-[#1c2127] text-white rounded-lg border border-[#3b4754]">
                        <option value="network">Network</option>
                        <option value="web">Web</option>
                        <option value="malware">Malware</option>
                        <option value="dos">DoS/DDoS</option>
                        <option value="scan">Scan</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="text-white text-sm font-medium mb-2 block">Mensaje</label>
                <input id="edit-rule-message" type="text" class="w-full px-4 py-2 bg-[#1c2127] text-white rounded-lg border border-[#3b4754]">
            </div>
            <div>
                <label class="text-white text-sm font-medium mb-2 block">Protocolo</label>
                <select id="edit-rule-protocol" class="w-full px-4 py-2 bg-[#1c2127] text-white rounded-lg border border-[#3b4754]">
                    <option value="tcp">TCP</option>
                    <option value="udp">UDP</option>
                    <option value="icmp">ICMP</option>
                    <option value="ip">IP</option>
                    <option value="http">HTTP</option>
                    <option value="ftp">FTP</option>
                    <option value="dns">DNS</option>
                    <option value="ssh">SSH</option>
                    <option value="smtp">SMTP</option>
                </select>
            </div>
            <div class="flex items-center gap-3">
                <input type="checkbox" id="edit-rule-enabled" class="w-5 h-5">
                <label for="edit-rule-enabled" class="text-white text-sm">Regla activa</label>
            </div>
        </div>
        <div class="flex gap-3 mt-6">
            <button id="save-edit-rule" class="flex-1 px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90">
                Guardar Cambios
            </button>
            <button id="cancel-edit-rule" class="flex-1 px-4 py-2 bg-[#283039] text-white rounded-lg hover:bg-[#3b4754]">
                Cancelar
            </button>
        </div>
    </div>
</div>

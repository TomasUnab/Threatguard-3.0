<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>ThreatGuard - Asset Inventory</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-white">
    <div class="relative flex h-auto min-h-screen w-full flex-col">
        <header class="sticky top-0 z-50 flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#283039] bg-background-dark px-10 py-3">
            <div class="flex items-center gap-8">
                <div class="flex items-center gap-4 text-white">
                    <div class="size-6 text-primary">
                        <span class="material-symbols-outlined !text-3xl">security</span>
                    </div>
                    <h2 class="text-white text-xl font-bold leading-tight tracking-[-0.015em]">ThreatGuard</h2>
                </div>
                <div class="flex items-center gap-9">
                    <a class="text-white text-sm font-medium leading-normal" href="/executive_summary/code.html">Dashboard</a>
                    <a class="text-white text-sm font-medium leading-normal" href="/alerts/code.html">Alerts</a>
                    <a class="text-primary text-sm font-bold leading-normal" href="/assets/code.html">Assets</a>
                    <a class="text-white text-sm font-medium leading-normal" href="/vulnerability_management/code.html">Vulnerability Management</a>
                    <a class="text-white text-sm font-medium leading-normal" href="/soar/code.html">SOAR</a>
                    <a class="text-white text-sm font-medium leading-normal" href="/reports/code.html">Reports</a>
                    <a class="text-white text-sm font-medium leading-normal" href="/settings/code.html">Settings</a>
                </div>
            </div>
            <div class="flex flex-1 justify-end gap-4">
                <div class="flex gap-2 relative">
                    <button id="btn-notifications" class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#283039] text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-3 hover:bg-[#3b4754]">
                        <span class="material-symbols-outlined">notifications</span>
                    </button>
                    <button id="btn-settings" class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#283039] text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-3 hover:bg-[#3b4754]">
                        <span class="material-symbols-outlined">settings</span>
                    </button>
                </div>
            </div>
        </header>
        
        <main class="flex flex-1 justify-center py-5 px-4 md:px-10 lg:px-40">
            <div class="layout-content-container flex flex-col max-w-[1400px] flex-1 gap-6">
                <!-- Asset Inventory View -->
                <div id="inventory-view">
                    <div class="flex flex-wrap justify-between gap-3 p-4">
                        <p class="text-white text-4xl font-black leading-tight tracking-[-0.033em] min-w-72">Inventario de Activos</p>
                        <button onclick="loadAssets()" class="flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors">
                            <span class="material-symbols-outlined">refresh</span>
                            <span>Actualizar</span>
                        </button>
                    </div>
                    <div class="px-4 py-3 @container">
                        <div class="flex overflow-hidden rounded-lg border border-[#3b4754] bg-[#111418]">
                            <table class="flex-1">
                                <thead>
                                    <tr class="bg-[#1c2127]">
                                        <th class="px-4 py-3 text-left text-white w-[250px] text-sm font-medium leading-normal">Hostname</th>
                                        <th class="px-4 py-3 text-left text-white w-[150px] text-sm font-medium leading-normal">IP</th>
                                        <th class="px-4 py-3 text-left text-white w-[200px] text-sm font-medium leading-normal">SO</th>
                                        <th class="px-4 py-3 text-left text-white w-[180px] text-sm font-medium leading-normal">Estado Agente</th>
                                        <th class="px-4 py-3 text-left text-white w-60 text-sm font-medium leading-normal">Vuln. Críticas</th>
                                        <th class="px-4 py-3 text-left text-white w-60 text-sm font-medium leading-normal">Vuln. Altas</th>
                                    </tr>
                                </thead>
                                <tbody id="assets-table">
                                    <tr>
                                        <td colspan="6" class="h-[72px] px-4 py-2 text-center text-[#9dabb9] text-sm">Cargando activos...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        
        async function loadAssets() {
            const tbody = document.getElementById('assets-table');
            tbody.innerHTML = '<tr><td colspan="6" class="h-[72px] px-4 py-2 text-center text-[#9dabb9] text-sm">Cargando activos...</td></tr>';
            
            try {
                const response = await fetch(`${API_URL}/assets`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                const assets = data.assets || [];

                if (!assets || assets.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="h-[72px] px-4 py-2 text-center text-[#9dabb9] text-sm">No hay agentes registrados. Ejecute el agente para registrar este dispositivo.</td></tr>';
                    return;
                }

                tbody.innerHTML = assets.map(asset => {
                    const isActive = asset.status === 'Active';
                    const statusClass = isActive ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400';
                    const statusText = isActive ? 'Online' : 'Offline';
                    const agentName = asset.agent_name || asset.hostname || 'Unknown';
                    const critical = asset.vulnerabilities_critical || 0;
                    const high = asset.vulnerabilities_high || 0;
                    
                    return `
                    <tr class="border-t border-t-[#3b4754] hover:bg-[#1c2127] cursor-pointer">
                        <td class="h-[72px] px-4 py-2 text-white text-sm font-normal leading-normal">${agentName}</td>
                        <td class="h-[72px] px-4 py-2 text-[#9dabb9] text-sm font-normal leading-normal">${asset.ip || 'N/A'}</td>
                        <td class="h-[72px] px-4 py-2 text-[#9dabb9] text-sm font-normal leading-normal">${asset.os || 'Unknown'}</td>
                        <td class="h-[72px] px-4 py-2 text-sm font-normal leading-normal">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${statusClass}">${statusText}</span>
                        </td>
                        <td class="h-[72px] px-4 py-2 text-sm font-normal leading-normal">
                            <span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-red-500/20 text-red-400 font-bold">${critical}</span>
                        </td>
                        <td class="h-[72px] px-4 py-2 text-sm font-normal leading-normal">
                            <span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-orange-500/20 text-orange-400 font-bold">${high}</span>
                        </td>
                    </tr>
                    `;
                }).join('');
                
            } catch (err) {
                console.error('Error cargando assets:', err);
                tbody.innerHTML = `<tr><td colspan="6" class="h-[72px] px-4 py-2 text-center text-red-400 text-sm">Error: ${err.message}</td></tr>`;
            }
        }

        // Cargar al iniciar
        document.addEventListener('DOMContentLoaded', loadAssets);
        
        // Auto-refresh cada 10 segundos para ver cambios en tiempo real
        setInterval(loadAssets, 10000);
    </script>
</body>
</html>
